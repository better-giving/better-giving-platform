packages:
  - apps/*
  - packages/brand
  - packages/chariot
  - packages/crypto
  - packages/design-cli
  - packages/emails
  - packages/paypal
  - packages/stocks
  - packages/types/*
  - packages/ui
catalog:
  typescript: 5.9.3
  '@types/node': 24.13.6
allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  # pnpm fails the install on a transitive build script with no verdict here,
  # so every one of them needs a line. these five stay unbuilt: the three
  # sqlite/prisma drivers are optional peers of drizzle-orm and better-auth
  # that nothing imports, and the other two ship prebuilt platform binaries as
  # optional deps, so their scripts are only the build-from-source fallback.
  '@parcel/watcher': false
  '@prisma/client': false
  '@sentry/cli': false
  better-sqlite3: false
  sqlite3: false
patchedDependencies:
  remix-client-cache@3.0.0: patches/remix-client-cache@3.0.0.patch
