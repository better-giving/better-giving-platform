pre-commit:
  commands:
    # blog-types (schema.json, types.ts, queries.ts) are committed artifacts,
    # regenerated manually out of band: pnpm --filter blog schema && typegen.
    # no drift guard — forgetting to regen just ships stale types until the next run.
    check:
      stage_fixed: true
      glob: "*.{ts,tsx,css,d.ts}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    type-check:
      glob:
        - "apps/platform/**/*.{ts,tsx}"
        # blog-types has no standalone tsconfig — its query overloads only mean
        # anything in platform's program, so check it under platform's config.
        - "packages/types/blog/**/*.ts"
      # anchor on platform's tsconfig (jsx, paths, react-router types); root has
      # no tsconfig.json to auto-detect, only the extended tsconfig.base.json.
      run: pnpm tsc-files -p apps/platform/tsconfig.json {staged_files}
    type-check-blog:
      glob: "apps/blog/**/*.{ts,tsx}"
      # anchor on blog's tsconfig (sanity jsx=preserve, dom lib); separate from
      # platform since each member has its own tsconfig.
      run: pnpm tsc-files -p apps/blog/tsconfig.json {staged_files}
    type-check-emails:
      glob: "packages/emails/**/*.{ts,tsx}"
      # anchor on emails' tsconfig (jsx=react-jsx, dom lib); separate from
      # platform since each member has its own tsconfig.
      run: pnpm tsc-files -p packages/emails/tsconfig.json {staged_files}
    type-check-emails-preview:
      glob: "apps/emails-preview/**/*.{ts,tsx}"
      # anchor on emails-preview' tsconfig (jsx=react-jsx, dom lib); separate
      # from emails since each member has its own tsconfig.
      run: pnpm tsc-files -p apps/emails-preview/tsconfig.json {staged_files}
    type-check-ui:
      glob: "packages/ui/**/*.{ts,tsx}"
      # anchor on ui's tsconfig (dom lib, jsx=react-jsx); source-only member,
      # same convention as brand/emails — separate from platform since each
      # member has its own tsconfig.
      run: pnpm tsc-files -p packages/ui/tsconfig.json {staged_files}
    type-check-design-sync:
      glob: "apps/design-sync/**/*.{ts,tsx}"
      # the previews are compiled by esbuild, which does not typecheck — a
      # preview passing a prop the component dropped builds, renders, and
      # silently shows less than it should. this is the only thing that
      # catches it before it reaches the design project.
      run: pnpm tsc-files -p apps/design-sync/tsconfig.json {staged_files}
    # no type-check-paypal / type-check-crypto hooks: built-member convention —
    # these emit dist/ via their own build, and type-safety is enforced there in
    # turbo/ci. biome check above still covers their staged files.
    type-check-brand:
      glob: "packages/brand/**/*.{ts,tsx}"
      # anchor on brand's tsconfig (extends the base, no dom/jsx); separate
      # from platform since each member has its own tsconfig.
      run: pnpm tsc-files -p packages/brand/tsconfig.json {staged_files}
    test-brand:
      # colors.ts mirrors colors.css and themes/default.css (the registry copies
      # in packages/ui) by hand-run generation, not a build step — this is the
      # only thing enforcing they stay in lockstep at commit time.
      glob:
        - "packages/brand/**/*.{ts,css}"
        - "packages/ui/src/styles/colors.css"
        - "packages/ui/src/styles/themes/*.css"
      run: pnpm --filter @better-giving/brand test